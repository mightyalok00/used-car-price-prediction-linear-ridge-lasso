  <text x="350" y="355" text-anchor="middle" font-family="Arial" font-size="14">α = 1</text>
  <text x="540" y="355" text-anchor="middle" font-family="Arial" font-size="14">α = 10</text>
  <text x="730" y="355" text-anchor="middle" font-family="Arial" font-size="14">α = 100</text>
  <text x="55" y="210" text-anchor="middle" font-family="Arial" font-size="14" transform="rotate(-90 55 210)">L2 coefficient norm</text>
