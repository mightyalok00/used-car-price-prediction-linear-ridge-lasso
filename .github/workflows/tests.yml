name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==3.0.5 numpy==2.5.2 scikit-learn==1.9.0 scipy matplotlib seaborn pytest

      - name: Run deterministic correctness tests
        run: python -m pytest -q
