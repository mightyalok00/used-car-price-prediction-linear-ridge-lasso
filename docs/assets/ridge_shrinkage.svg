  <text x="450" y="60" text-anchor="middle" font-family="Arial" font-size="14">L2 coefficient norm across alpha values</text>
  <line x1="110" y1="330" x2="820" y2="330" stroke="#555"/>
  <line x1="110" y1="90" x2="110" y2="330" stroke="#555"/>
  <polyline points="160,112 350,130 540,180 730,280" fill="none" stroke="#4c78a8" stroke-width="4"/>
  <circle cx="160" cy="112" r="7" fill="#4c78a8"/><circle cx="350" cy="130" r="7" fill="#4c78a8"/><circle cx="540" cy="180" r="7" fill="#4c78a8"/><circle cx="730" cy="280" r="7" fill="#4c78a8"/>
  <text x="160" y="100" text-anchor="middle" font-family="Arial" font-size="14">4.06</text>
  <text x="350" y="118" text-anchor="middle" font-family="Arial" font-size="14">3.77</text>
